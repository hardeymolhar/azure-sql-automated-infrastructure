# =========================================================
# WINDOWS SQL SERVER VM (az CLI deploy + Ansible config)
# =========================================================

# Base Windows Server platform image (no Marketplace plan/terms required).
# SQL Server 2022 Developer + SSMS are downloaded from the internet and
# installed unattended by the Ansible playbook (sql-server-on-windows.yml).
WIN_VM_NAME="ms-$RESOURCE_SUFFIX"    

WIN_SUBNET_NAME="subnet-win-$RESOURCE_SUFFIX"
WIN_SUBNET_PREFIX="10.10.2.0/24"

AZURE_BASTION_SUBNET_NAME="AzureBastionSubnet"
AZURE_BASTION_SUBNET_PREFIX="10.10.3.0/26"

  # SQL Node 1
WIN_VM_NAME_2="cs-$RESOURCE_SUFFIX"    # SQL Node 2

PROBE_PORT="59999"
# Availability zones — production HA architecture:
#   Zone 1 -> SQL Node 1   |   Zone 2 -> SQL Node 2
# (Both VMs share one VNet/subnet; each VM's data disks must be in the SAME zone
# as the VM, so the disk scripts create zonal disks accordingly.)
WIN_VM_ZONE="1"
WIN_VM_ZONE_2="2"

WIN_IMAGE="MicrosoftWindowsServer:WindowsServer:2022-datacenter-azure-edition:latest"
WIN_VM_SIZE="Standard_B2ms"

# SQL Server 2022 Developer-edition installer (SSEI bootstrapper).
# aka.ms link is a Microsoft-operated redirect to download.microsoft.com.
SQL_INSTALLER_URL="https://aka.ms/sqlserver2022developer"

WIN_NIC_NAME="nic-win-$RESOURCE_SUFFIX"
WIN_NIC_NAME_2="nic-win2-$RESOURCE_SUFFIX"
WIN_PUBLIC_IP_NAME="pip-win-$RESOURCE_SUFFIX"
WIN_PUBLIC_IP_NAME_2="pip-win2-$RESOURCE_SUFFIX"
WIN_NSG_NAME="nsg-win-$RESOURCE_SUFFIX"
WIN2_NSG_NAME="nsg2-win-$RESOURCE_SUFFIX"

WIN_OS_DISK="winsql-osdisk-$RESOURCE_SUFFIX"
WIN_OS_DISK_2="winsql-osdisk2-$RESOURCE_SUFFIX"

# ---------------------------------------------------------
# Windows SQL VM encrypted data disks (SSE-CMK via dedicated DES)
# ---------------------------------------------------------
# Mirrors the Linux DES/CMK pattern (encrypted-mgd-disks.sh) but with a
# dedicated Disk Encryption Set so the Windows workload is isolated from the
# Linux one. Both share the same Key Vault key (DISK_ENCRYPTION_SET_KEY).
# Disks are created + attached by win-encrypted-disks.sh and formatted in-guest
# by ansible/playbooks/windows-dbdrive-configuration.yml.
WIN_DES_NAME="winsql-des-$RESOURCE_SUFFIX"

WIN_DATA_DISK="winsql-data-dsk-$RESOURCE_SUFFIX"
WIN_LOG_DISK="winsql-log-dsk-$RESOURCE_SUFFIX"
WIN_TEMP_DISK="winsql-tempdb-dsk-$RESOURCE_SUFFIX"
WIN_BACKUP_DISK="winsql-backup-dsk-$RESOURCE_SUFFIX"

# SQL Node 2 (Zone 2) encrypted data disks — same sizes/SKU/DES as Node 1,
# created zonal in Zone 2 so they can attach to the Zone-2 VM.
WIN_DATA_DISK_2="winsql-data-dsk2-$RESOURCE_SUFFIX"
WIN_LOG_DISK_2="winsql-log-dsk2-$RESOURCE_SUFFIX"
WIN_TEMP_DISK_2="winsql-tempdb-dsk2-$RESOURCE_SUFFIX"
WIN_BACKUP_DISK_2="winsql-backup-dsk2-$RESOURCE_SUFFIX"

# Disk sizes (GB) — kept modest for the sandbox; raise to match prod sizing.
WIN_DATA_DISK_SIZE="4022"
WIN_LOG_DISK_SIZE="2011"
WIN_TEMP_DISK_SIZE="1024"
WIN_BACKUP_DISK_SIZE="8124"
WIN_DISK_SKU="StandardSSD_LRS"

# WinRM HTTP listener port — kept open as a fallback (NSG-locked to CLIENT_IP).
# Ansible's primary connection is the HTTPS listener below (HTTPS_WIN_WINRM_PORT).
WIN_WINRM_PORT="5985"

# Ready-to-connect SQL login + database created by the playbook
SQL_LOGIN="appuser"
SQL_LOGIN_PASSWORD="$ADMIN_PASSWORD"
SQL_DB_NAME="demo-db"

# Local Windows account granted SQL access via Windows Authentication
# (created alongside the SQL login by sql-server-on-windows.yml).
WIN_SQL_LOGIN="winsqluser"
WIN_SQL_LOGIN_PASSWORD="$ADMIN_PASSWORD"


# ---------------------------------------------------------
# Internal Load Balancer for the Always On AG listener
# ---------------------------------------------------------
# Standard, internal ILB providing the "floating" listener IP for the AG.
# Frontend/backend ports are both 1433 (floating IP / direct server return).
# PROBE_PORT (59999, above) is the TCP health-probe port the in-guest listener
# answers on so the LB knows which node currently owns the AG.
LB_NAME="sql-lb-$RESOURCE_SUFFIX"
LB_FRONTEND_NAME="sql-listener"
LB_BACKEND_POOL_NAME="sql-ag-backend-pool"
LB_PROBE_NAME="sql-ag-probe"
LB_RULE_NAME="sql-ag-rule"
LB_PRIVATE_IP="10.10.1.200"   # must be free inside SUBNET_NAME (10.10.1.0/24)
SQL_PORT="1433"

