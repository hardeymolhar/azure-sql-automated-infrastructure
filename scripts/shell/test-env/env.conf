# =========================================================
# AZURE BASTION
# =========================================================
# Connects to the Linux + Windows VMs over their PRIVATE IPs (no public
# exposure needed). Subnet name is MANDATORY and fixed by Azure; it must be
# exactly "AzureBastionSubnet" and at least /26. Standard SKU + tunneling lets
# us use the native client from macOS:
#   - Linux : az network bastion ssh   (SSH)
#   - Windows: az network bastion tunnel -> Microsoft Remote Desktop (RDP)
# Provisioned by bastion.sh (takes ~5-10 min to deploy).

BASTION_SUBNET_NAME="AzureBastionSubnet"

BASTION_SUBNET_PREFIX="10.10.3.0/26"

BASTION_PUBLIC_IP_NAME="pip-bastion-$RESOURCE_SUFFIX"

BASTION_NAME="bastion-$RESOURCE_SUFFIX"

